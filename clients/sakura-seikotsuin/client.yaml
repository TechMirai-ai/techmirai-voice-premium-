clientId: sakura-seikotsuin
status: demo            # fictional business, dummy data only

business:
  type: seikotsuin      # 整骨院 (judo-therapy / bone-setting clinic)
  name:
    ja: さくら整骨院
    en: Sakura Seikotsuin
  # VP-6 D: the en-US Azure voice mispronounced "Seikotsuin" (VAPI-FACTS.md,
  # VP-3 latency investigation — STT heard it back as "Saikatsuan"). No Azure
  # pronunciation-dictionary/SSML hint exists in Vapi (VAPI-FACTS.md VP-6 R6),
  # so this is the documented fallback: a phonetic respelling used only when
  # the English assistant *speaks* the name. `name.en` above is unchanged and
  # stays the correct romanization for any future written/display use.
  namePronunciation:
    en: Sakura Say-koh-tsoo-in
  address:
    postalCode: "330-0000"
    ja: 埼玉県さいたま市浦和区サンプル町1丁目2番3号
    en: 1-2-3 Sample-cho, Urawa-ku, Saitama City, Saitama
  phone:
    display: "048-000-0000"
    e164: "+81480000000"
  website: https://sakura-seikotsuin.example.com
  hours:
    timezone: Asia/Tokyo
    weekly:
      mon: { open: "09:00", close: "19:00" }
      tue: { open: "09:00", close: "19:00" }
      wed: { open: "09:00", close: "19:00" }
      thu: { open: "09:00", close: "19:00" }
      fri: { open: "09:00", close: "19:00" }
      sat: { open: "09:00", close: "19:00" }
      sun: closed
    closedOnNationalHolidays: true

languages:
  default: ja
  supported: [ja, en]
  settings:
    ja:
      voice: { provider: azure, voiceId: ja-JP-NanamiNeural }
      # VP-2 (VAPI-FACTS.md R1): Azure's own supported-language table lists ja-JP directly.
      transcriber: { provider: azure, language: ja-JP }
      switchKeywords: ["日本語", "Japanese"]   # 日本語 = "Japanese"
      # VP-7 R8: if the assistant SAYS one of these, Vapi hangs up after it finishes speaking —
      # a backstop for when the model speaks a farewell instead of calling endCall.
      # 失礼いたします = "goodbye" (lit. "I'm being rude by leaving"); 失礼します = its plainer form.
      endCallPhrases: ["失礼いたします", "失礼します"]
      # Words that signal possibly-serious pain (激痛 = "intense/sharp pain", ひどい痛み = "terrible pain",
      # 耐えられない = "unbearable", 突然 = "suddenly", 動けない = "can't move", 我慢できない = "can't bear").
      severePainWords: ["激痛", "ひどい痛み", "耐えられない", "我慢できない", "突然", "動けない"]
      # Things a caller says when finished (shown to the model as examples): "Thank you very much",
      # "That's all", "No, that's all, thank you", "Understood, thank you", "OK, thanks".
      callerDoneExamples: ["ありがとうございました", "以上です", "いえ、大丈夫です、ありがとうございます", "わかりました、ありがとうございました", "はい、結構です"]
      # VP-7: digits for the phone read-back (0..9). Example is 090-1234-5678 (11 digits, 3-4-4).
      # ニー/ゴー use a long vowel so 2 and 5 are unmistakable on the phone.
      phoneReadback:
        digitWords: ["ゼロ", "イチ", "ニー", "サン", "ヨン", "ゴー", "ロク", "ナナ", "ハチ", "キュウ"]
        example: "ゼロキュウゼロ、イチニーサンヨン、ゴーロクナナハチ"
    en:
      voice: { provider: azure, voiceId: en-US-JennyNeural }
      transcriber: { provider: azure, language: en-US }
      # 英語 = "English"; イングリッシュ = "English" in katakana — how a Japanese
      # transcriber is likely to actually write the spoken word (source docs A7).
      switchKeywords: ["English", "英語", "イングリッシュ"]
      # VP-7 R8: same backstop as `ja` — the assistant saying one of these hangs up the call.
      endCallPhrases: ["goodbye", "have a great day"]
      severePainWords: ["severe", "intense", "excruciating", "unbearable", "sudden", "sharp", "can't move"]
      callerDoneExamples: ["Thank you very much", "That's all", "No, that's all, thank you", "Got it, thank you", "OK, thanks"]
      phoneReadback:
        digitWords: ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"]
        example: "zero nine zero, one two three four, five six seven eight"

callback:
  enabled: true
  collect: [name, phone]
  offerWhen:
    - no_faq_match
    - caller_asks_for_staff
  notifiers: []                  # database only for now — see FUTURE-FEATURES F-2

safety:
  emergencyNumber: "119"
  noMedicalAdvice: true

scripts:
  # Japanese assistant's first message. Includes the English option.
  greeting:
    # VP-7: wording from the source test suite (04-test-suite.md case 1) — identifies as AI, and no
    # longer promises "お取り次ぎ" (putting the call through), which this assistant cannot do.
    # Gloss for the project owner (never spoken): "Thank you for calling. This is [clinic], AI
    # reception. For English, please say 'English'. How may I help you?" NEEDS NATIVE-SPEAKER REVIEW.
    en: >-
      Thank you for calling [[clinicName]]. This is the AI reception.
      For English, please say "English". How may I help you?
    ja: >-
      お電話ありがとうございます。[[clinicName]]、AI受付でございます。
      For English, please say "English". どのようなご用件でしょうか。
  # English assistant's first message after the handoff.
  englishGreeting:
    # VP-7: wording from the source test suite (E1) — no "English receptionist"/handoff wording.
    en: >-
      Hello, you've reached [[clinicName]]. This is the clinic's AI receptionist, speaking in English.
      How can I help you today?
    ja: >-
      こんにちは。[[clinicName]]です。こちらは英語でご案内するAI受付でございます。ご用件をお聞かせください。
  # Japanese assistant's first message when a caller is handed BACK to it from
  # the English assistant (VP-3). Only the assistant's own language is spoken
  # (.ja); .en is a gloss for the project owner's review, never spoken.
  # NEEDS NATIVE-SPEAKER REVIEW, like the rest of the Japanese content.
  handoffToJapanese:
    ja: 日本語の受付にお繋ぎしました。ご用件をお聞かせください。
    en: "(Gloss for Jamal, not spoken: 'Connected back to Japanese reception. Please tell me what you need.')"
  anythingElse:
    en: Is there anything else I can help you with today?
    ja: ほかに何かお手伝いできることはございますか？
  noMatch:
    en: >-
      I'm sorry, I don't have that information right now.
      I can pass your details to our staff so they can get back to you.
      May I have your name, please?
    ja: >-
      申し訳ございません。その件については、ただいまお答えできる情報がございません。
      スタッフから折り返しご連絡できるよう、お客様の情報をお伝えいたします。
      お名前を伺ってもよろしいでしょうか？
  staffContactOffer:
    en: >-
      Of course. I can pass your details to our staff so they can call you back.
      May I have your name, please?
    ja: >-
      かしこまりました。スタッフから折り返しご連絡できるよう、お客様の情報をお伝えいたします。
      お名前を伺ってもよろしいでしょうか？
  askPhone:
    en: Thank you. May I have a phone number where our staff can reach you?
    ja: ありがとうございます。スタッフからご連絡できるお電話番号を教えていただけますか？
  confirmDetails:
    en: Let me confirm. Your name is [[callerName]], and your phone number is [[callerPhone]]. Is that correct?
    ja: 確認いたします。お名前は[[callerName]]様、お電話番号は[[callerPhone]]でよろしいでしょうか？
  callbackSaved:
    en: Thank you. I'll pass your information to our staff, and they will contact you within one business day.
    ja: ありがとうございます。スタッフにお伝えいたしますので、翌営業日までにご連絡いたします。
  callbackFailed:
    en: >-
      I'm sorry, I wasn't able to save your details because of a system problem.
      Could you please call again a little later?
    ja: >-
      申し訳ございません。システムの不具合により、お客様の情報を保存できませんでした。
      お手数ですが、少し時間をおいて改めてお電話いただけますでしょうか。
  didNotCatch:
    en: I'm sorry, I didn't quite catch that. Could you say it again, please?
    ja: 申し訳ございません。うまく聞き取れませんでした。もう一度おっしゃっていただけますか？
  # VP-7 follow-up: asks for a phone number again (wrong digit count, or "no" to the read-back).
  # Wording from the source test suite (cases 18/19). Separate from didNotCatch on purpose, so it
  # never counts toward the three-strikes hang-up. NEEDS NATIVE-SPEAKER REVIEW.
  phoneRetry:
    en: >-
      Excuse me, I'm not sure I caught all of that. Could you give me the phone number once more, please?
    ja: >-
      恐れ入ります、少し聞き取れなかったようでして、もう一度お電話番号をお願いできますでしょうか。
  # VP-7: spoken after three failed attempts in a row to understand the caller,
  # right before the call ends — NEEDS NATIVE-SPEAKER REVIEW.
  repeatedMisunderstanding:
    # VP-7 follow-up: now ends with the same closing phrase as `endCallPhrases`, so speaking this
    # line hangs up the call on the platform side even if the model forgets the endCall tool
    # (case 29 showed it speaking the line and then leaving the call open). NEEDS NATIVE-SPEAKER REVIEW.
    en: >-
      I'm sorry, the line seems unclear. Could you please call again a little later? Goodbye.
    ja: >-
      申し訳ございません。お電話が遠いようですので、お手数ですが、
      少し時間をおいておかけ直しいただけますでしょうか。失礼いたします。
  noMedicalAdvice:
    en: >-
      I'm sorry, I can't give medical advice.
      Our staff can talk with you about your symptoms when you visit or contact the clinic.
    ja: >-
      申し訳ございません。症状についての医学的なアドバイスはいたしかねます。
      ご来院の際や当院へのお問い合わせの際に、スタッフが詳しくお話を伺います。
  # VP-7: clear red-flag emergency — said immediately, no conditional wording.
  emergency:
    # Ends with the closing phrase (endCallPhrases) so Vapi hangs up as soon as the line finishes —
    # no later turn is needed, which matters because production call 01a0d7e1 showed the model
    # repeating an emergency line forever when the platform dropped its own replies from the
    # history (2026-09-25). NEEDS NATIVE-SPEAKER REVIEW.
    en: >-
      Please hang up and call [[emergencyNumber]] for an ambulance right away. Goodbye.
    ja: >-
      すぐにお電話を切って、[[emergencyNumber]]番に連絡し、救急車を呼んでください。失礼いたします。
  # VP-7: uncertain/possibly-serious pain — two-tier emergency handling (source
  # docs A8). NEEDS NATIVE-SPEAKER REVIEW.
  emergencyUncertain:
    en: >-
      If this is an emergency, please hang up and call [[emergencyNumber]] for an ambulance right away.
    ja: >-
      緊急の場合は、このお電話を切って、すぐに[[emergencyNumber]]番で救急車を呼んでください。
  # VP-7 R3: the model speaks this itself right after the emergency path, before
  # calling endCall — the normal `goodbye`/endCallMessage still plays right
  # after (accepted tradeoff, see docs/VAPI-FACTS.md). NEEDS NATIVE-SPEAKER REVIEW.
  emergencyGoodbye:
    en: Goodbye.
    ja: 失礼いたします。
  goodbye:
    en: Thank you for calling [[clinicName]]. Have a great day. Goodbye.
    ja: "[[clinicName]]にお電話いただき、ありがとうございました。失礼いたします。"

faq:
  - id: hours
    tags: [hours, open, closed, schedule]
    question:
      en: What are your opening hours?
      ja: 受付時間を教えてください。
    answer:
      en: We are open Monday to Saturday, from 9:00 AM to 7:00 PM. We are closed on Sundays and national holidays.
      ja: 当院の受付時間は、月曜日から土曜日の午前9時から午後7時までです。日曜日と祝日はお休みです。

  - id: appointment-needed
    tags: [appointment, reservation, walk-in]
    question:
      en: Do I need an appointment?
      ja: 予約は必要ですか？
    answer:
      en: Appointments are recommended, especially for first-time visitors. However, walk-ins may also be accepted depending on availability.
      ja: 初めてご来院の方は、事前のご予約をおすすめしています。ただし、予約状況によっては、予約なしでもご来院いただけます。

  - id: how-to-book
    tags: [appointment, reservation, booking]
    question:
      en: How can I make an appointment?
      ja: 予約はどのようにできますか？
    answer:
      en: You can book through the online reservation form on our website. If you'd like to book by phone instead, we can have a staff member call you back to arrange it.
      ja: 当院ホームページのオンライン予約からご予約いただけます。お電話でのご予約をご希望の場合は、担当の者から折り返しご連絡いたします。

  - id: fees
    tags: [price, cost, fee]
    question:
      en: How much does a treatment cost?
      ja: 施術料金はいくらですか？
    answer:
      en: Treatment fees depend on the type of treatment and your condition. Pricing is on our website, and staff can explain the details.
      ja: 施術料金は、施術内容やお身体の状態によって異なります。料金は当院ホームページでご確認いただけるほか、詳しくはスタッフがご説明いたします。

  - id: back-pain
    tags: [back pain, neck pain, shoulder pain, knee pain, joint pain, movement, discomfort]
    question:
      en: Do you treat back pain?
      ja: 腰痛の施術はできますか？
    answer:
      en: Yes. We provide treatment for back pain, neck and shoulder pain, and other pain or movement-related discomfort.
      ja: はい。腰痛や、首・肩の痛みなど、お身体の痛みや動かしにくさに関するお悩みに対して施術を行っています。

  - id: sports-injuries
    tags: [sports, injury, rehabilitation]
    question:
      en: Do you treat sports injuries?
      ja: スポーツによるケガにも対応していますか？
    answer:
      en: Yes. We provide care and rehabilitation support for sports injuries, and help you return to your sport safely.
      ja: はい。スポーツによるケガの施術やリハビリのサポートを行い、安全にスポーツへ復帰できるようお手伝いします。

  - id: insurance
    tags: [insurance, health insurance, coverage]
    question:
      en: Do you accept health insurance?
      ja: 健康保険は使えますか？
    answer:
      en: Whether health insurance can be used depends on the type of injury and your situation. Staff can explain the details.
      ja: 健康保険が使えるかどうかは、ケガの種類や状況によって異なります。詳しくはスタッフがご説明いたします。

  - id: location
    tags: [address, location, access, directions, map]
    question:
      en: Where is the clinic located?
      ja: 整骨院はどこにありますか？
    answer:
      en: We are located at [[clinicAddress]]. Please check our website for a map and directions.
      ja: 当院は[[clinicAddress]]にございます。地図やアクセス方法は、当院のホームページをご確認ください。

  - id: parking
    tags: [parking, car]
    question:
      en: Is parking available?
      ja: 駐車場はありますか？
    answer:
      en: Yes, parking is available near the clinic. Staff can explain where to park.
      ja: はい、当院の近くに駐車場がございます。詳しい場所はスタッフがご案内いたします。

  - id: first-visit
    tags: [first visit, bring, documents, insurance card]
    question:
      en: What should I bring to my first visit?
      ja: 初めて来院するときは、何を持っていけばいいですか？
    answer:
      en: If applicable, please bring your My Number health insurance card or your eligibility certificate. It also helps to bring any information about previous treatments or injuries related to your current concern.
      ja: 必要に応じて、マイナ保険証または資格確認書をお持ちください。また、今回のお悩みに関係する過去の治療やケガの情報があれば、あわせてお持ちいただくとスムーズです。
